# CI for hyperdag-protocol.
#
# This repository had no CI at all, and 98% of its tracked files were vendored
# node_modules. The first thing an external reviewer does is clone and install,
# and until now that failed — so the most valuable check here is the boring one:
# `npm ci` from the committed lockfile has to work.
#
# DESIGN RULE: no vacuous green. Four of five packages have no tests. A single
# green tick across the repo would claim coverage that does not exist, so the
# `coverage-map` job prints the real per-package state and the contract tests
# report their true tally rather than being hidden.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate that actually regressed. Blocking on purpose: if a clean clone
  # cannot install from the lockfile, nothing else in this file means anything.
  install:
    name: clean install from lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: npm ci (root workspace)
        run: npm ci
      - name: assert node_modules is not tracked
        # The regression this repo actually had. Cheap to check, and it fails
        # the moment someone commits a dependency tree again.
        run: |
          count=$(git ls-files | grep -c '^node_modules/' || true)
          echo "tracked node_modules files: $count"
          if [ "$count" -ne 0 ]; then
            echo "::error::node_modules is tracked again ($count files). It is build output; the lockfile is the record."
            exit 1
          fi

  # The published contract. Blocking: BUILDERS.md is what an outside developer
  # is told to trust, and a version or an exit code that drifted is a lie.
  # check:map pins the map ("How the pieces fit") to the code that makes each
  # edge, so the four public repositories it names are checked out read-only,
  # sparse, beside it. Without them the map half is NOT_CHECKED (exit 2), which
  # fails this step rather than passing it.
  # (Job name unchanged on purpose: a ruleset may require it by name.)
  builders:
    name: BUILDERS.md matches published trustshell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run check:builders
      - uses: actions/checkout@v4
        with:
          repository: DealAppSeo/repid-engine
          path: .siblings/repid-engine
          persist-credentials: false
          sparse-checkout: src
      - uses: actions/checkout@v4
        with:
          repository: DealAppSeo/trustshell
          path: .siblings/trustshell
          persist-credentials: false
          sparse-checkout: |
            src
            extension
      - uses: actions/checkout@v4
        with:
          repository: DealAppSeo/HyperDAG-core
          path: .siblings/HyperDAG-core
          persist-credentials: false
          sparse-checkout: services/zkp-postcard
      - uses: actions/checkout@v4
        with:
          repository: DealAppSeo/trinity-symphony-shared
          path: .siblings/trinity-symphony-shared
          persist-credentials: false
          sparse-checkout: lib
      - name: the map matches the code it describes
        env:
          HYPERDAG_SIBLINGS_DIR: ${{ github.workspace }}/.siblings
        run: npm run check:map

  # Marco's ERC-8004 contract tests. NON-BLOCKING and reported honestly.
  # 2026-10-06, measured from this job: test/core.ts 61 of 61 and test/upgradeable.ts 18 of 18.
  # Every contract and both test files are byte-identical to erc-8004/erc-8004-contracts at
  # b9e466c. Until that day our ReputationRegistry carried an unshipped experiment
  # (x402PaymentProof, a 9th giveFeedback argument), which failed 28 of the team's tests;
  # Sean approved restoring their file.
  # From 2026-08-06 to 2026-10-06 nothing compiled (HHE1000, artifact not found): our root
  # lockfile resolved OpenZeppelin 5.6.1, which removed __UUPSUpgradeable_init. The team's
  # lockfile pins 5.4.0; ours does now.
  # Still continue-on-error: making it gating is a separate decision.
  contracts:
    name: contracts tests (79 of 79 pass against the ERC-8004 team's unmodified contracts — reported, not gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: build the contracts first
        # A compile error is printed here, instead of surfacing as HHE1000 (artifact not
        # found) in every test, which is how OpenZeppelin 5.6.1 hid for two months.
        # Same env as the tests: the config needs it to load.
        env:
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
        working-directory: packages/contracts
        run: npx hardhat build 2>&1 | tail -20 || true
      - name: run contract tests
        # hardhat.config.ts requires these to be present or the config itself is
        # rejected (HHE15) before a single test runs. Public read-only endpoints:
        # the suite under test is local, so this makes an ENV failure impossible
        # to mistake for a TEST failure.
        # Each suite runs on its own: packages/contracts' `npm test` is core && upgradeable,
        # so a core failure meant the upgradeable suite never ran and was never reported.
        env:
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
        working-directory: packages/contracts
        run: |
          npm run test:core 2>&1 | tee ../../contracts-core.log || true
          npm run test:upgradeable 2>&1 | tee ../../contracts-upgradeable.log || true
      - name: report the real tally
        # A suite with no tally line did not run to the end: NOT CHECKED, never zero.
        run: |
          for suite in core upgradeable; do
            pass=$(grep -oP '^# pass \K\d+' "contracts-$suite.log" | head -1 || true)
            fail=$(grep -oP '^# fail \K\d+' "contracts-$suite.log" | head -1 || true)
            if [ -z "$pass" ] || [ -z "$fail" ]; then
              echo "### Contract tests, $suite: NOT CHECKED (no tally line)" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::contract suite $suite produced no tally"
              continue
            fi
            echo "### Contract tests, $suite: $pass passing, $fail failing" >> "$GITHUB_STEP_SUMMARY"
            if [ "$fail" -gt 0 ]; then
              echo "::warning::$suite has $fail failing; it passed in full on 2026-10-06"
            fi
          done
          echo "Measured 2026-10-06: core 61 passing, upgradeable 18 passing, against contracts byte-identical to erc-8004/erc-8004-contracts." >> "$GITHUB_STEP_SUMMARY"

  # Makes absence of tests VISIBLE. An unwired safeguard is worse than an absent
  # one because it converts a known gap into false coverage; the same is true of
  # a package that silently has no tests at all.
  coverage-map:
    name: per-package test coverage map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enumerate
        run: |
          {
            echo "### Which packages actually have tests"
            echo ""
            echo "| package | test script | script matches files | test files |"
            echo "|---|---|---|---|"
            # Enumerate by MANIFEST, not by directory depth.
            #
            # The first version of this loop globbed `packages/*/` — one level —
            # and so reported on circuits/contracts/defaults/interfaces/protocol
            # while the only real packages live one level deeper at
            # packages/defaults/*/. It also credited `packages/defaults` with a
            # test-file count gathered by a `find` that DID recurse, so a
            # directory with no manifest appeared to have tests. A job whose
            # stated purpose is making absent tests visible was itself reporting
            # a status it had no means to determine. Finding a package is now
            # done the only way that cannot drift: locate its package.json.
            git ls-files '*package.json' \
              | grep -v node_modules \
              | grep -v '^package.json$' \
              | sort \
              | while read -r manifest; do
                  dir=$(dirname "$manifest")
                  name=${dir#packages/}
                  script=$(node -e "try{const s=require('./$manifest').scripts||{};process.stdout.write(s.test||'')}catch(e){}" 2>/dev/null)
                  if [ -n "$script" ]; then
                    has="\`$script\`"
                    # A declared script proves nothing if its glob matches no file.
                    # hallucination-hal-local declares `node --test tests/*.test.ts`
                    # and ships only .mjs smoke files, so it greens over an empty set.
                    pattern=$(echo "$script" | grep -oE '[A-Za-z0-9_./*-]+\.(test|spec)\.[a-z]+' | head -1)
                    if [ -n "$pattern" ]; then
                      # shellcheck disable=SC2086
                      matched=$(ls $dir/$pattern 2>/dev/null | wc -l)
                      [ "$matched" -gt 0 ] && matches="$matched" || matches="**0 — greens over an empty set**"
                    else
                      matches="n/a"
                    fi
                  else
                    has="**none**"
                    matches="—"
                  fi
                  files=$(find "$dir" -path '*/node_modules' -prune -o \
                            \( -name '*.test.*' -o -name '*.spec.*' -o -path '*/tests/*' -o -path '*/test/*' \) -type f -print 2>/dev/null | wc -l)
                  echo "| $name | $has | $matches | $files |"
                done
          } >> "$GITHUB_STEP_SUMMARY"
